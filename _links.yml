# ---------------------------------------------------------------------------
# 메뉴 항목별 연결 주소 — 링크는 이 파일 한 곳에서만 고친다.
#
#   app  : 실행 화면(Streamlit 앱 등)
#   repo : GitHub 저장소
#   doc  : 설명서·교재·논문
#
# 빈 문자열("")이면 그 버튼은 나오지 않는다. 셋 다 비어 있으면 페이지에
