name: Wake Streamlit apps

# 무료 Streamlit 앱은 방문이 없으면 잠든다. 사이트에 끼워 넣은 앱이 빈 화면으로 보이지 않도록
# 6시간마다 앱을 열어 잠들었으면 깨운다(scripts/wake_apps.py). 실패하면 이 작업이 실패로 표시된다.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Wake apps
        run: python scripts/wake_apps.py
